name: compatibility-tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python source
        run: python -m compileall -q regionfixer.py regionfixer_core nbt mutf8 progressbar tests

      - name: Run compatibility tests
        run: python -m unittest discover -s tests -v

      - name: Verify CLI help
        run: python regionfixer.py --help

      - name: Verify CLI version
        run: python regionfixer.py --version

  native:
    name: native scanner / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run the Rust unit tests
        run: cargo test --no-default-features --manifest-path native/Cargo.toml

      - name: Build the native scanner
        run: ./build_native.sh

      - name: Run the test suite with the native scanner
        run: python -m unittest discover -s tests -v

      - name: Run the test suite without the native scanner
        run: python -m unittest discover -s tests -v
        env:
          REGIONFIXER_NO_NATIVE: '1'
