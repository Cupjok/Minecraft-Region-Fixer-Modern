[package]
name = "regionfixer_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Native fast scanner core for Minecraft Region Fixer Modern"
license = "GPL-3.0-or-later"

[lib]
name = "regionfixer_native"
crate-type = ["cdylib", "rlib"]

[features]
# The Python bindings are on by default; unit tests build without them so
# they do not need a Python interpreter to link against.
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"], optional = true }
rayon = "1"
memmap2 = "0.9"
libdeflater = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
